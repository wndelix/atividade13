<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 10</title>
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    <form action="/enviar_dados" method="get"></form>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required><br><br>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required><br><br>

      <label for="pais">País:</label>
      <select id="pais" name="pais">
        <option value="brasil">Brasil</option>
        <option value="eua">Estados Unidos</option>
        <option value="portugal">Portugal</option>
      </select><br><br>

      <label for="mensagem">Mensagem:</label>
      <textarea type="mensagem" id="mensagem" rows="4" cols="30"></textarea><br><br>

      <input type="submit" id="send" value="Enviar">
      <input type="reset" id="clean" value="Limpar">
</body>
</html>
